name: Update price targets

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional: update one ticker, e.g. SEB-A.ST. Leave empty for all OMXS30 companies."
        required: false
        default: ""
  schedule:
    - cron: "20 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: omxs30-data-writes
  cancel-in-progress: false

jobs:
  update-price-targets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Börskollen price targets
        run: |
          extra_args=()
          ticker_input="${{ github.event.inputs.ticker }}"
          if [ -n "$ticker_input" ]; then
            extra_args+=(--ticker "$ticker_input")
          fi

          python scripts/update_riktkurser.py --output data/riktkurser.json "${extra_args[@]}"

      - name: Validate price-target files
        run: |
          python - <<'PY'
          import json
          import sys

          with open("data/riktkurser.json", encoding="utf-8") as file:
              primary = json.load(file)
          with open("data/price_targets.json", encoding="utf-8") as file:
              compatibility = json.load(file)

          companies = primary.get("companies", [])
          loaded = [company for company in companies if company.get("targetPrice") is not None]
          print(f"Provider: {primary.get('provider')}")
          print(f"Generated at: {primary.get('generatedAt')}")
          print(f"Companies: {len(companies)}")
          print(f"Companies with target price: {len(loaded)}")

          if len(companies) != 30:
              sys.exit("The price-target file must retain all 30 OMXS30 companies.")
          if not loaded:
              sys.exit("No price targets were fetched. Open the previous step to see which page slugs failed.")
          if primary != compatibility:
              sys.exit("data/riktkurser.json and data/price_targets.json are not identical.")
          PY

      - name: Commit updated price targets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/riktkurser.json data/price_targets.json

          if git diff --cached --quiet; then
            echo "No price-target changes to commit"
            exit 0
          fi

          git commit -m "Update price targets"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          done

          echo "Could not push updated price targets after 3 attempts"
          exit 1
