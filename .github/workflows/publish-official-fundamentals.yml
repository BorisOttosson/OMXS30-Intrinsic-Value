name: Publish verified official fundamentals

on:
  push:
    paths:
      - .github/workflows/publish-official-fundamentals.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested update
        env:
          UPDATE_PATCH: ""
        run: |
          printf '%s' "$UPDATE_PATCH" | base64 --decode | gzip --decompress > /tmp/official-fundamentals.patch
          git apply --check /tmp/official-fundamentals.patch
          git apply /tmp/official-fundamentals.patch

      - name: Verify update
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v
          node --check app.js

      - name: Publish verified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js data/official-fundamentals.json data/official-sources.json data/omxs30-data.json index.html scripts/import_verified_fundamentals.py tests/test_import_verified_fundamentals.py tests/test_legacy_snapshot.py
          git commit -m "Import verified official fundamentals safely"
          git pull --rebase origin main
          git push
