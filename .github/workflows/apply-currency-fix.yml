name: Apply currency label fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch update_data.py
        run: |
          echo "" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-currency-fix.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Label converted values as quote currency and sanity-check EPS"
          git push
