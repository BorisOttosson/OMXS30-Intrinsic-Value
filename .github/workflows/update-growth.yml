name: Update consensus growth data

on:
  schedule:
    - cron: "17 5 * * 1" # every Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omxs30-data-writes
  cancel-in-progress: false

jobs:
  update-growth:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch Yahoo Finance growth estimates
        run: python scripts/update_growth.py

      - name: Commit updated data
        run: |
          if [ ! -f data/growth.json ]; then
            echo "No growth file written"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/growth.json

          if git diff --cached --quiet; then
            echo "No growth changes to commit"
            exit 0
          fi

          git commit -m "Update consensus growth data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          done

          echo "Could not push updated growth data after 3 attempts"
          exit 1
