name: Update consensus growth data

on:
  schedule:
    - cron: "17 5 * * 1" # every Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch 5y growth data for OMXS30
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Yahoo rate-limits GitHub-hosted runners (HTTP 429), so skip it in CI
          # and rely on Finnhub. Run the script locally to use Yahoo consensus.
          SKIP_YAHOO: "1"
        run: node scripts/fetch-growth.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/growth.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update OMXS30 growth data"
            git push
          fi
