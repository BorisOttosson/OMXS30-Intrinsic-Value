name: Update consensus growth data

on:
  schedule:
    - cron: "17 5 * * 1" # every Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Yahoo earningsTrend for OMXS30
        run: node scripts/fetch-growth.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/growth.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update OMXS30 consensus growth data"
            git push
          fi
