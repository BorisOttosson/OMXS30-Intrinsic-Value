name: Apply TTM dedup fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Splice the fixed TTM helpers into update_data.py
        run: |
          python - <<'PYEOF'
          block = open("scripts/_ttm_block.py", encoding="utf-8").read()
          src = open("scripts/update_data.py", encoding="utf-8").read()
          start = src.index("def borsapi_normalize_quarter_key")
          end = src.index("BORSAPI_CASHFLOW_DEPRECIATION_KEYS = (")
          out = src[:start] + block + src[end:]
          open("scripts/update_data.py", "w", encoding="utf-8").write(out)
          compile(out, "scripts/update_data.py", "exec")
          print("patched", len(src), "->", len(out))
          PYEOF
      - name: Remove the one-shot patch files
        run: |
          rm -f scripts/_ttm_block.py .github/workflows/apply-ttm-dedup-fix.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix TTM quarter dedup: bucket by accounting quarter, require four consecutive quarters"
          git push
