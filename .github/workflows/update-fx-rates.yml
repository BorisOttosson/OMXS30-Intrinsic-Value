name: Update FX rates

on:
  schedule:
    - cron: "30 16 * * 1-5" # Weekdays after the daily European reference-rate publication
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest Sveriges Riksbank reference rates
        run: python scripts/update_fx_rates.py

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fx-rates.json
          git diff --staged --quiet || git commit -m "chore: update FX rates"
          git push
