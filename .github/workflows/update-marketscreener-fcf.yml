name: Update MarketScreener forecasts

on:
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional space-separated tickers (e.g. 'ATCO-A.ST VOLV-B.ST'). Empty = all."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape MarketScreener FCF and EPS forecasts
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: python scripts/update_marketscreener_fcf.py ${{ github.event.inputs.tickers }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marketscreener-fcf.json
          git diff --staged --quiet || git commit -m "chore: update MarketScreener FCF data"
          git push
